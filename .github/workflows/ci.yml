name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-tests:
    name: Native engine tests (host)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Build & run (ASan + UBSan)
        run: |
          cmake -S engine/native/src/test/cpp -B build/host -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/host -j
          ctest --test-dir build/host --output-on-failure

  android:
    name: Unit tests + APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK, NDK, CMake
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools ndk;30.0.16248370 cmake;3.31.6'

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache ncnn prebuilt
        uses: actions/cache@v4
        with:
          path: engine/native/third_party
          key: ncnn-${{ hashFiles('engine/native/build.gradle.kts') }}

      - name: Test & build
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace :core:model:test assembleRelease 2>&1 | tee build-output.txt

      - name: Report failure on the commit
        if: failure() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '### CI failed'
            echo '```'
            grep -A3 -E "^e: |error:|FAILED|What went wrong" build-output.txt | head -100 || true
            echo '```'
            echo 'Tail:'
            echo '```'
            tail -50 build-output.txt
            echo '```'
          } | head -c 60000 > failure.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -f body="$(cat failure.md)" > /dev/null

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: rescale-apks
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
