name: Release

# Releases happen when either
#  - a tag vX.Y.Z is pushed, or
#  - main gets a CHANGELOG.md whose top "## vX.Y.Z" heading has no release yet
#    (bump the changelog, push, done; CI creates the tag).
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      # Job-level so steps can test for it (the secrets context isn't allowed in `if:`).
      KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v5

      - name: Work out version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(grep -m1 -oE '^## v[0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md | sed 's/^## v//')
            if [ -z "$VERSION" ]; then echo "No version heading in CHANGELOG.md"; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; fi
            if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "v$VERSION is already released; nothing to do."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Releasing v$VERSION"

      - uses: actions/setup-java@v5
        if: steps.version.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3
        if: steps.version.outputs.skip != 'true'
        with:
          packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools ndk;30.0.16248370 cmake;3.31.6'

      - uses: gradle/actions/setup-gradle@v4
        if: steps.version.outputs.skip != 'true'

      - name: Private signing key (if configured)
        if: steps.version.outputs.skip != 'true' && env.KEYSTORE_B64 != ''
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "RESCALE_KEYSTORE=$RUNNER_TEMP/release.jks"
            echo "RESCALE_STORE_PASSWORD=${{ secrets.STORE_PASSWORD }}"
            echo "RESCALE_KEY_ALIAS=${{ secrets.KEY_ALIAS }}"
            echo "RESCALE_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}"
          } >> "$GITHUB_ENV"

      - name: Build signed release APKs
        if: steps.version.outputs.skip != 'true'
        run: ./gradlew --no-daemon --stacktrace -PversionName="$VERSION" :core:model:test assembleRelease

      - name: Collect, verify, checksum
        if: steps.version.outputs.skip != 'true'
        run: |
          mkdir -p out
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner | sort | tail -1)
          for apk in app/build/outputs/apk/release/*.apk; do
            name=$(basename "$apk" | sed -e "s/^app-/rescale-$VERSION-/" -e 's/-release//')
            cp "$apk" "out/$name"
            "$APKSIGNER" verify --print-certs "out/$name" | head -3
          done
          (cd out && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Release notes from CHANGELOG
        if: steps.version.outputs.skip != 'true'
        run: |
          awk -v v="## v$VERSION" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
          cat >> notes.md <<'EOF'

          **Install:** open this page on your phone, download the APK and tap it. Most phones want **arm64-v8a**; **universal** works on everything.
          Checksums are in `SHA256SUMS.txt`.
          EOF

      - uses: softprops/action-gh-release@v2
        if: steps.version.outputs.skip != 'true'
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          name: Rescale v${{ env.VERSION }}
          body_path: notes.md
          files: |
            out/*.apk
            out/SHA256SUMS.txt
