name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      # Job-level so steps can test for it (the secrets context isn't allowed in `if:`).
      KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools ndk;30.0.16248370 cmake;3.31.6'

      - uses: gradle/actions/setup-gradle@v4

      - name: Version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Private signing key (if configured)
        if: env.KEYSTORE_B64 != ''
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "RESCALE_KEYSTORE=$RUNNER_TEMP/release.jks"
            echo "RESCALE_STORE_PASSWORD=${{ secrets.STORE_PASSWORD }}"
            echo "RESCALE_KEY_ALIAS=${{ secrets.KEY_ALIAS }}"
            echo "RESCALE_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}"
          } >> "$GITHUB_ENV"

      - name: Build signed release APKs
        run: ./gradlew --no-daemon --stacktrace -PversionName="$VERSION" :core:model:test assembleRelease

      - name: Collect, verify, checksum
        run: |
          mkdir -p out
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner | sort | tail -1)
          for apk in app/build/outputs/apk/release/*.apk; do
            name=$(basename "$apk" | sed -e "s/^app-/rescale-$VERSION-/" -e 's/-release//')
            cp "$apk" "out/$name"
            "$APKSIGNER" verify --print-certs "out/$name" | head -3
          done
          (cd out && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Release notes from CHANGELOG
        run: |
          awk -v v="## v$VERSION" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
          cat >> notes.md <<'EOF'

          **Install:** open this page on your phone, download the APK and tap it. Most phones want **arm64-v8a**; **universal** works on everything.
          Checksums are in `SHA256SUMS.txt`.
          EOF

      - uses: softprops/action-gh-release@v2
        with:
          name: Rescale v${{ env.VERSION }}
          body_path: notes.md
          files: |
            out/*.apk
            out/SHA256SUMS.txt
