name: Artifact report
description: Seams, halos, colour shifts, weird textures or other ugly output
labels: [quality]
body:
  - type: textarea
    id: describe
    attributes:
      label: What looks wrong?
      description: Attach the original image if you can share it, plus a crop of the problem area.
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options: [Photo, Anime / Art]
    validations:
      required: true
  - type: dropdown
    id: scale
    attributes:
      label: Scale
      options: ["2×", "4×"]
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: Ran on (shown on the result screen)
      options: [GPU, CPU]
  - type: input
    id: device
    attributes:
      label: Device
