# Draft metadata for submitting Rescale to F-Droid (fdroiddata: metadata/app.rescale.yml).
# Not used by this repo's own builds.
Categories:
  - Graphics
License: GPL-3.0-only
AuthorName: EmotionalLeaves
SourceCode: https://github.com/EmotionalLeaves/Rescale
IssueTracker: https://github.com/EmotionalLeaves/Rescale/issues
Changelog: https://github.com/EmotionalLeaves/Rescale/blob/main/CHANGELOG.md

AutoName: Rescale

RepoType: git
Repo: https://github.com/EmotionalLeaves/Rescale.git

Builds:
  - versionName: 0.5.0
    versionCode: 5002   # arm64-v8a split: (MAJOR*10000 + MINOR*100 + PATCH) * 10 + 2
    commit: v0.5.0
    subdir: app
    sudo:
      - apt-get update
      - apt-get install -y cmake ninja-build
    gradle:
      - yes
    prebuild:
      - ../scripts/fetch-ncnn-source.sh
    gradleprops:
      - abis=arm64-v8a
      - ncnnSource=engine/native/third_party/ncnn-src
      - versionName=0.5.0
    ndk: r30

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9.]+$
CurrentVersion: 0.5.0
CurrentVersionCode: 5002

# Notes for reviewers:
# - Model weights in app/src/main/assets/models are data (BSD-3-Clause, Real-ESRGAN); the
#   general-x4v3 conversion is reproducible with tools/model-conversion/export_ncnn.py.
# - Optional model packs are downloaded only when the user taps Download, from this
#   project's GitHub releases; all are BSD-3-Clause or Apache-2.0.
